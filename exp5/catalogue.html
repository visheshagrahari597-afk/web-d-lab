<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Online Bookstore Catalogue">
    <meta name="author" content="Vansh">
    <title>Book Catalogue</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="catalogue-page">

    <h2>Book Catalogue</h2>

    <table class="catalogue">

        <tr>
            <th>Cover</th>
            <th>Book</th>
            <th>Author</th>
            <th>Publisher</th>
            <th>Price</th>
            <th>Add to Cart</th>
        </tr>

        <tr>
            <td>■</td>
            <td>XML Bible</td>
            <td>Winston</td>
            <td>Wiley</td>
            <td>$40.5</td>
            <td>
                <button type="button"
                    onclick="addToCart('XML Bible', 40.5)">
                    Add to Cart
                </button>
            </td>
        </tr>

        <tr>
            <td>■</td>
            <td>Artificial Intelligence</td>
            <td>S. Russell</td>
            <td>Prentice Hall</td>
            <td>$63</td>
            <td>
                <button type="button"
                    onclick="addToCart('Artificial Intelligence', 63)">
                    Add to Cart
                </button>
            </td>
        </tr>

        <tr>
            <td>■</td>
            <td>Java 2</td>
            <td>Watson</td>
            <td>BPB Publications</td>
            <td>$35.5</td>
            <td>
                <button type="button"
                    onclick="addToCart('Java 2', 35.5)">
                    Add to Cart
                </button>
            </td>
        </tr>

        <tr>
            <td>■</td>
            <td>HTML in 24 Hours</td>
            <td>Sam Peter</td>
            <td>Sam Publications</td>
            <td>$50</td>
            <td>
                <button type="button"
                    onclick="addToCart('HTML in 24 Hours', 50)">
                    Add to Cart
                </button>
            </td>
        </tr>

    </table>

    <script>

        function addToCart(name, price) {

            let cart = JSON.parse(localStorage.getItem("cart")) || [];

            cart.push({
                name: name,
                price: price
            });

            localStorage.setItem("cart", JSON.stringify(cart));

            alert(name + " added to cart");

        }

    </script>

</body>

</html>
